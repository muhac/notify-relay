version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      toolchain:
        patterns: [ '*' ]
    # Node's types follow the oldest Node the relay supports, not the newest
    ignore:
      - dependency-name: '@types/node'
        update-types: [ 'version-update:semver-major' ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: [ '*' ]

  # Weekly, as the base image's updates are mostly security fixes
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # The image follows Node's LTS line, moved on by hand; odd-numbered majors are short-lived
    ignore:
      - dependency-name: node
        update-types: [ 'version-update:semver-major' ]
