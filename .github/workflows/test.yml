name: Test

# Runs on PRs and main: typecheck, tests on the Workers runtime and on Node, both bundles, and the
# container image, run as a deployment would. The typecheck is a separate step because esbuild strips
# types without checking them. Nothing here deploys; deployments pick a commit and run it themselves.

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Bundle
        run: npm run build

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag notify-relay:test .

      - name: Smoke test
        run: test/docker/smoke.sh notify-relay:test
